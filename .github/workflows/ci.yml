name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python tests
        run: |
          pip install num2words
          python -m unittest discover -s tests -v

      - name: Build app
        run: ./build.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: CloneNSpeak-app
          path: build/Clone'n'Speak.app
